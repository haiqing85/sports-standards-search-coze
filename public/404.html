<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体育标准查询系统 - 重定向中</title>
  <script>
    // GitHub Pages SPA 路由重定向脚本
    // 此文件会被复制到 dist 目录，用于处理直接访问子路径时的 404 问题
    
    (function() {
      // 获取当前路径
      var pathSegmentsToKeep = 0; // 仓库名称的路径段数，0 表示没有仓库名前缀
      
      // 检测是否在 GitHub Pages 上
      var hostname = window.location.hostname;
      if (hostname.includes('github.io')) {
        // 获取仓库名称
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        if (pathSegments.length > 0) {
          // 假设第一个路径段是仓库名
          pathSegmentsToKeep = 1;
        }
      }
      
      // 构建重定向路径
      var l = window.location;
      var base = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
      var path = l.pathname;
      
      // 提取相对路径
      var relativePath = path;
      if (pathSegmentsToKeep > 0) {
        var segments = path.split('/').filter(Boolean);
        if (segments.length > pathSegmentsToKeep) {
          relativePath = '/' + segments.slice(pathSegmentsToKeep).join('/');
        } else {
          relativePath = '/';
        }
      }
      
      // 构建目标 URL
      var targetUrl = base;
      if (pathSegmentsToKeep > 0) {
        var repoName = l.pathname.split('/')[1];
        targetUrl += '/' + repoName;
      }
      targetUrl += '/?redirect=' + encodeURIComponent(relativePath);
      
      // 执行重定向
      window.location.replace(targetUrl);
    })();
  </script>
</head>
<body>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/">
  </noscript>
  <div style="text-align: center; padding: 50px;">
    <h1>正在重定向...</h1>
    <p>如果您没有被自动重定向，<a href="/">请点击这里</a></p>
  </div>
</body>
</html>
