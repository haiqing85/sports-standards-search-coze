<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>体育行业标准查询系统</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      crossorigin="anonymous"
    />
    <!-- GitHub Pages SPA 路由修复 - 增强版 -->
    <script>
      (function() {
        // 处理从 404.html 重定向过来的请求
        var redirect = new URLSearchParams(window.location.search).get('redirect');
        if (redirect) {
          // 移除查询参数并更新历史记录
          var cleanUrl = window.location.pathname;
          if (redirect !== '/' && redirect !== '') {
            cleanUrl = redirect;
          }
          window.history.replaceState({}, '', cleanUrl);
        }
        
        // 检测是否在 GitHub Pages 环境
        if (window.location.hostname.includes('github.io')) {
          // 处理直接访问子路径的情况
          var path = window.location.pathname;
          
          // 如果路径不是根路径且不以 index.html 结尾
          if (path !== '/' && !path.endsWith('/index.html') && !/\.[^/.]+$/.test(path)) {
            // 获取仓库名称
            var pathSegments = path.split('/').filter(Boolean);
            var repoName = pathSegments.length > 0 ? pathSegments[0] : '';
            
            // 构建重定向 URL
            var targetUrl = repoName ? `/${repoName}/?redirect=${encodeURIComponent(path)}` : `/?redirect=${encodeURIComponent(path)}`;
            window.location.replace(targetUrl);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
